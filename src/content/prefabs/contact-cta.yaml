name: Contact call-to-action
description: "Closing band inviting visitors to get in touch."
props:
  title: { en: Let's make something people remember, ar: لنصنع شيئاً يبقى في الذاكرة }
  text: { en: "Open to game, 3D and UX collaborations.", ar: "متاح للتعاون في الألعاب والتصميم ثلاثي الأبعاد وتجربة المستخدم." }
  label: { en: Get in touch, ar: تواصل معي }
  href: "mailto:REPLACE-WITH-YOUR-EMAIL"
section:
  theme: accent
  align: center
  spacing: l
  blocks:
    - type: heading
      text: "{{title}}"
    - type: text
      text: "{{text}}"
    - type: button
      label: "{{label}}"
      href: "{{href}}"
      style: outline
