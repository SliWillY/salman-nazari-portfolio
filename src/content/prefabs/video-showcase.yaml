  theme: dark
section:
  theme: "{{theme}}"
  width: wide
  blocks:
    - type: heading
      text: "{{title}}"
    - type: video
      provider: "{{provider}}"
      id: "{{id}}"
      title: "{{title}}"
      caption: "{{caption}}"
