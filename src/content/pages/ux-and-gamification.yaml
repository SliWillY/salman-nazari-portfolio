title: { en: UX & Gamification, ar: تجربة المستخدم والتلعيب }
description:
  en: Human-centered journeys, working prototypes, and experiments designed around motivation.
  ar: رحلات تتمحور حول الإنسان ونماذج أولية وتجارب مصممة حول الدافع.
eyebrow: { en: Systems and behavior, ar: الأنظمة والسلوك }

sections:
  # Tanafusi: featured case study — summary, key signals, one framed screenshot; the button opens the full study.
  - spacing: s
    blocks:
      #- type: text
        #size: large
        #text:
          #en: "My game development practice moves between visual direction and systems thinking: environment design, lighting, game design documents, level design documents, and playable prototypes."
          #ar: "يتنقل عملي في تطوير الألعاب بين التوجيه البصري والتفكير في الأنظمة: تصميم البيئات والإضاءة ووثائق تصميم الألعاب والمراحل والنماذج القابلة للعب."
      - type: divider
        style: line
        above: none
        below: l

      - type: image-text
        image: "03-student-analytics_aeokka"
        alt: { en: "Tanafusi student analytics screen", ar: "شاشة تحليلات الطالب في تنافسي" }
        aspect: "16 / 10"
        frame: browser
        # Screen stack: hover / tap the screenshot to fan these out. Fill in each Cloudinary public ID after uploading
        # the screenshots from the case study (assets/screenshots/); entries with an empty image are skipped, and the
        # stack switches on once at least two screens have an ID.
        gallery:
          - image: "03-student-analytics_aeokka"
            alt: { en: "Tanafusi student analytics screen", ar: "شاشة تحليلات الطالب في تنافسي" }
            caption: { en: Student analytics, ar: تحليلات الطالب }
          - image: "11-student-dashboard_1_fz9obr"   # TODO: 11-student-dashboard.webp
            alt: { en: "Student dashboard showing level, progress and ranking", ar: "لوحة الطالب تعرض المستوى والتقدم والترتيب" }
            caption: { en: Student dashboard, ar: لوحة الطالب }
          - image: "02-daily-logging_hfka5d"   # TODO: 02-daily-logging.webp
            alt: { en: "Daily activity logging screen", ar: "شاشة تسجيل النشاط اليومي" }
            caption: { en: Daily logging, ar: التسجيل اليومي }
          - image: "04-admin-leaderboards_bcbjfp"   # TODO: 04-admin-leaderboards.webp
            alt: { en: "Admin view of individual, team and clan leaderboards", ar: "عرض المشرف للوحات الصدارة للأفراد والفرق والعشائر" }
            caption: { en: Leaderboards, ar: لوحات الصدارة }
          - image: "01-admin-dashboard_bhjysm"   # TODO: 09-student-store.webp
            alt: { en: "Admin Dashboard", ar: "لوحة المشرف" }
            caption: { en: Admin Dashboard, ar: لوحة المشرف }
        eyebrow: { en: "Case study · Web app · 4-week program", ar: "دراسة حالة · تطبيق ويب · برنامج من 4 أسابيع" }
        heading: { en: Tanafusi, ar: تنافسي }
        level: 2
        text:
          en: A gamification platform for a four-week summer program. Students log daily activity and earn points, streaks and rewards, while teams and clans turn that effort into belonging.
          ar: منصة تلعيب لبرنامج صيفي مدته أربعة أسابيع. يسجّل الطلاب نشاطهم اليومي ويكسبون النقاط والسلاسل والمكافآت، بينما تحوّل الفرق والعشائر هذا الجهد إلى انتماء.
        details:
          - label: { en: Hypothesis, ar: الفرضية }
            text: { en: "External rewards start the movement; belonging gives it social meaning.", ar: "المكافآت الخارجية تبدأ الحركة، والانتماء يمنحها معنى اجتماعياً." }
          - label: { en: My role, ar: دوري }
            tags:
              - { en: Research, ar: البحث }
              - { en: System design, ar: تصميم النظام }
              - { en: UX, ar: تجربة المستخدم }
              - { en: Build, ar: التطوير }
              - { en: Testing, ar: الاختبار }
          - label: { en: Stack, ar: التقنيات }
            tags: [Flask, PostgreSQL, JavaScript]
        button:
          label: { en: Read the full case study, ar: اقرأ دراسة الحالة كاملة }
          href: https://sliwilly.github.io/tanafusi-case-study/
          style: primary

